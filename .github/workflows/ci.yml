name: Godot CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: false

      - name: Verify Godot
        run: godot --version

      - name: Import project
        shell: bash
        run: |
          godot --headless --path . --editor --quit 2>&1 | tee "$RUNNER_TEMP/godot-import.log"
          # Godot can report import errors while returning exit code 0.
          if grep -Eq 'ERROR:|SCRIPT ERROR:' "$RUNNER_TEMP/godot-import.log"; then
            echo "::error::Godot reported errors while importing the project."
            exit 1
          fi

      - name: Run CI test suite
        run: godot --headless --path . --script tests/run_ci_tests.gd

      - name: Regenerate asset catalog
        run: godot --headless --path . --script tools/build_asset_catalog.gd

      - name: Verify asset catalog is up to date
        run: |
          if ! git diff --exit-code -- data/asset_catalog.json; then
            echo ""
            echo "ERROR: data/asset_catalog.json is out of date."
            echo "Run this locally:"
            echo "godot --headless --path . --script tools/build_asset_catalog.gd"
            echo "Then commit the updated catalog."
            exit 1
          fi
