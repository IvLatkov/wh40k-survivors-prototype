name: Godot CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: false

      - name: Verify Godot
        run: godot --version

      - name: Import project
        run: godot --headless --path . --editor --quit

      - name: Run CI test suite
        run: godot --headless --path . --script tests/run_ci_tests.gd

      - name: Regenerate asset catalog
        run: godot --headless --path . --script tools/build_asset_catalog.gd

      - name: Verify asset catalog is up to date
        run: |
          if ! git diff --exit-code -- data/asset_catalog.json; then
            echo ""
            echo "ERROR: data/asset_catalog.json is out of date."
            echo "Run this locally:"
            echo "godot --headless --path . --script tools/build_asset_catalog.gd"
            echo "Then commit the updated catalog."
            exit 1
          fi